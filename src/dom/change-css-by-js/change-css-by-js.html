<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change CSS by JS</title>
</head>
<body>
    <div class="body">
        <h1>Change CSS by JS</h1>

        <span id="textChange">Nội dung cần đổi CSS</span>

        <button id="btnYellow">Màu vàng</button>
        <button id="btnViolet">Màu tím</button>
    </div>

    <script src="change-css-by-js.js"></script>
</body>
<style>
    /* ====== Reset & layout cơ bản ====== */
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(135deg, #1e1e2f, #3a3a5c);
    }

    .body {
        display: grid;
        grid-column: 1;
        gap: 4px;
        text-align: center;
        padding: 40px 50px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.15);
    }

    h1 {
        color: #fff;
        margin-bottom: 25px;
        letter-spacing: 1px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    /* ====== Style cho span #textChange ====== */
    #textChange {
        display: inline-block;
        padding: 15px 30px;
        margin-bottom: 25px;
        font-size: 20px;
        font-weight: 600;
        border-radius: 12px;
        background: #ffffff;
        color: #333;
        transition: all 0.4s ease;
    }

    /* ====== Style cho buttons ====== */
    button {
        padding: 12px 24px;
        margin: 0 8px;
        font-size: 16px;
        font-weight: 600;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        color: #fff;
    }

    #btnYellow {
        background: linear-gradient(135deg, #f6d365, #fda085);
    }

    #btnViolet {
        background: linear-gradient(135deg, #a18cd1, #fbc2eb);
    }

    button:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    button:active {
        transform: translateY(0);
    }

    /* ====== style1: Lộng lẫy kiểu "Hoàng Kim" ====== */
    .style1 {
        background: linear-gradient(135deg, #ffd700, #ff8c00, #ffd700) !important;
        background-size: 200% 200% !important;
        animation: goldShine 2s ease infinite, pulseGlow 1.5s ease-in-out infinite alternate;
        text-shadow: 0 0 10px #fff, 0 0 20px #ffd700, 0 0 30px #ff8c00 !important;
        border: 2px solid #fff8dc !important;
        box-shadow: 0 0 15px #ffd700, 0 0 30px #ff8c00, inset 0 0 15px rgba(255, 255, 255, 0.6) !important;
        letter-spacing: 2px;
        transform: scale(1.08) !important;
    }

    /* ====== style2: Lộng lẫy kiểu "Tím Huyền Bí" ====== */
    .style2 {
        background: linear-gradient(135deg, #8e2de2, #4a00e0, #c471ed) !important;
        background-size: 200% 200% !important;
        animation: violetFlow 3s ease infinite, pulseGlow 1.5s ease-in-out infinite alternate;
        text-shadow: 0 0 10px #fff, 0 0 20px #c471ed, 0 0 30px #4a00e0 !important;
        border: 2px solid #e0b3ff !important;
        box-shadow: 0 0 15px #8e2de2, 0 0 30px #4a00e0, inset 0 0 15px rgba(255, 255, 255, 0.5) !important;
        letter-spacing: 2px;
        transform: scale(1.08) !important;
    }

    /* ====== Keyframes ====== */
    @keyframes goldShine {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    @keyframes violetFlow {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    @keyframes pulseGlow {
        from { filter: brightness(1); }
        to   { filter: brightness(1.3); }
    }
</style>
</html>
